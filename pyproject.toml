[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viabsa"
version = "0.1.0"
description = "Vietnamese aspect-based sentiment analysis for cosmetics reviews: data pipeline, baselines, multi-head transformers, ONNX, FastAPI and Streamlit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pyyaml>=6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Fine-tuning, explainability, ONNX export, experiment tracking.
train = [
    "torch>=2.2",
    "transformers>=4.40",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "mlflow>=2.12",
    "pyvi>=0.1.1",
]
# Inference only (ONNX), no PyTorch needed.
onnx = ["onnxruntime>=1.18", "transformers>=4.40"]
serve = ["fastapi>=0.116.1", "uvicorn[standard]>=0.29", "pydantic>=2.6", "httpx>=0.27"]
app = ["streamlit>=1.57.0", "httpx>=0.27"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10", "pre-commit>=3.7", "httpx>=0.27"]

[project.scripts]
viabsa-prepare = "viabsa.data.prepare:main"
viabsa-baseline = "viabsa.training.train_baseline:main"
viabsa-train = "viabsa.training.train_transformer:main"
viabsa-export-onnx = "viabsa.export_onnx:main"
viabsa-benchmark = "viabsa.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["torch: tests that need PyTorch + transformers (skipped when missing)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Vietnamese text triggers ambiguous-unicode warnings

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
